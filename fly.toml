# Fly.io: one always-on machine (the sync loop runs in-process) with a volume for SQLite + replays.
# Secrets (not in this file): TRACKER_SITE_PASSWORD, TRACKER_ADMIN_TOKEN — set with `fly secrets set`.

app = "topgun-training"
primary_region = "fra"

[build]

[[mounts]]
  source = "tracker_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep it running: background sync + live civ challenge board need the process alive.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
